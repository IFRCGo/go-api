app:
  environment: PROD
  # Short base name so generated CronJob names stay well under the 52-char cap
  # (k8s appends a timestamp to spawn Jobs, which must stay <= 63 chars).
  fullnameOverride: go-api

  # The app reaches the headless-browser server (templates/playwright.yaml) here.
  # Redis (broker + cache) URLs are wired alongside the Dragonfly CR in
  # values/operators/dragonfly.yaml, and the Elasticsearch host alongside its cluster
  # in values/operators/elasticsearch.yaml; all merge into extraEnvVars at render time.
  extraEnvVars:
    PLAYWRIGHT_SERVER_URL: { value: "ws://go-api-playwright:3000/" }

  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["./deploy/run_web.sh"]   # gunicorn --bind 0.0.0.0:80 (no nginx)
    probes:
      enabled: true
    ingress:
      enabled: true
      className:      # cluster default IngressClass; body-size via values/traefik.yaml
      host:
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 4Gi

  worker:
    enabled: true
    queueDefaults:
      commandPrefix: ["celery", "-A", "main", "worker", "-l", "INFO"]
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
      volumes:
        celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
      volumeMounts:
        celery-heartbeat: {mountPath: /var/run/celery}
      probes:
        enabled: true
        liveness:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startup:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 5
          failureThreshold: 30
      resources:
        requests:
          cpu: "0.5"
          memory: 0.5Gi
        limits:
          memory: 4Gi
    queues:
      # NOTE: keys must be lowercase. One worker drains all three app queues
      # (default/heavy/cronjob), matching the previous run_celery_prod behaviour.
      default:
        enabled: true
        celeryArgs: ["-Q", "default,heavy,cronjob", "--concurrency", "2"]
    # No beat: go-api has no in-code schedule / django-celery-beat; scheduled work
    # runs as CronJobs below (Sentry-monitored via main/sentry.py).

  hooks:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          memory: 2Gi
    jobs:
      # db-migrate + collect-static inherit the chart defaults (migrate /
      # collectstatic --noinput). wait-for-resources gates api/worker on
      # db + cache (redis) + celery broker (redis) connectivity.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker"]

  cronjobs:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 2Gi
    # NOTE: job keys + schedules are kept in sync with main/sentry.py SentryMonitor
    # (validated by the cron_job_monitor command). Keep both in lockstep.
    jobs:
      index_and_notify:
        enabled: true
        schedule: "*/5 * * * *"
        command: ["./manage.py", "index_and_notify"]
      sync_molnix:
        enabled: true
        schedule: "10 */2 * * *"
        command: ["./manage.py", "sync_molnix"]
      ingest_appeals:
        enabled: true
        schedule: "*/30 * * * *"
        command: ["./manage.py", "ingest_appeals"]
      sync_appealdocs:
        enabled: true
        schedule: "15 * * * *"
        command: ["./manage.py", "sync_appealdocs"]
      revoke_staff_status:
        enabled: true
        schedule: "51 * * * *"
        command: ["./manage.py", "revoke_staff_status"]
      update_project_status:
        enabled: true
        schedule: "1 3 * * *"
        command: ["./manage.py", "update_project_status"]
      user_registration_reminder:
        enabled: true
        schedule: "0 9 * * *"
        command: ["./manage.py", "user_registration_reminder"]
      ingest_country_plan_file:
        enabled: true
        schedule: "1 0 * * *"
        command: ["./manage.py", "ingest_country_plan_file"]
      fdrs_annual_income:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "fdrs_annual_income"]
      FDRS_INCOME:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "FDRS_INCOME"]
      ingest_acaps:
        enabled: true
        schedule: "0 1 * * 0"
        command: ["./manage.py", "ingest_acaps"]
      ingest_climate:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_climate"]
      ingest_databank:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_databank"]
      ingest_hdr:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_hdr"]
      ingest_unicef:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_unicef"]
      ingest_worldbank:
        enabled: true
        schedule: "0 2 * * 0"
        command: ["./manage.py", "ingest_worldbank"]
      ingest_disaster_law:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_disaster_law"]
      ingest_ns_contact:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_ns_contact"]
      ingest_ns_capacity:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_ns_capacity"]
      ingest_ns_directory:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_ns_directory"]
      ingest_ns_document:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_ns_document"]
      ingest_ns_initiatives:
        enabled: true
        schedule: "0 0 * * 0"
        command: ["./manage.py", "ingest_ns_initiatives"]
      ingest_icrc:
        enabled: true
        schedule: "0 3 * * 0"
        command: ["./manage.py", "ingest_icrc"]
      notify_validators:
        enabled: true
        schedule: "0 0 * * *"
        command: ["./manage.py", "notify_validators"]
      poll_gdacs_cyclone:
        enabled: true
        schedule: "0 11 * * 0"
        command: ["./manage.py", "poll_gdacs_cyclone"]
      poll_gdacs_flood:
        enabled: true
        schedule: "0 11 * * *"
        command: ["./manage.py", "poll_gdacs_flood"]
      poll_usgs_earthquake:
        enabled: true
        schedule: "0 18 * * 0"
        command: ["./manage.py", "poll_usgs_earthquake"]
      alert_notification:
        enabled: true
        schedule: "0 */2 * * *"
        command: ["./manage.py", "alert_notification"]
      oauth_cleartokens:
        enabled: true
        schedule: "0 1 * * *"
        command: ["./manage.py", "oauth_cleartokens"]
      eap_submission_reminder:
        enabled: true
        schedule: "0 0 * * *"
        command: ["./manage.py", "eap_submission_reminder"]

  # NOTE: Check main/settings.py for all available options.
  env:
    GO_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_DEBUG: "false"
    # Object storage: Azure Blob is the deployment backend (pod filesystem is ephemeral)
    AZURE_STORAGE_ENABLED: "true"
    SENTRY_SAMPLE_RATE: "0.2"

  secrets: {}

# Headless-browser server for screenshot / PDF-export tasks (templates/playwright.yaml).
# Consumed by this chart's own template, not the app subchart.
playwright:
  enabled: true
  name: go-api-playwright   # NOTE: also the Service name PLAYWRIGHT_SERVER_URL points at
  image: "mcr.microsoft.com/playwright:v1.50.0-noble"
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: "0.1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
