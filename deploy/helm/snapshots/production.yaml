# Hook files ConfigMap for: elasticsearch-zero-replicas
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-api-elasticsearch-zero-replicas-files
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: go-api
    component: hook
    hookName: elasticsearch-zero-replicas
    environment: production
    release: release-name
data:
  es_zero_replicas.py: "import time\n\nfrom elasticsearch.client import IndicesClient\n\nfrom api.esconnection import ES_CLIENT\n\nTEMPLATE_NAME = \"zzz-zero-replicas\"\nSETTINGS = {\"index\": {\"number_of_replicas\": 0}}\nWAIT_DEADLINE_SECONDS = 600\n\nif ES_CLIENT is None:\n    print(\"No Elasticsearch host configured; nothing to do\")\nelse:\n    # Wait for the cluster to accept writes, i.e. at least yellow. Waiting\n    # for green is impossible here: green needs the very setting this\n    # script applies.\n    deadline = time.monotonic() + WAIT_DEADLINE_SECONDS\n    while True:\n        try:\n            ES_CLIENT.cluster.health(wait_for_status=\"yellow\", timeout=\"10s\")\n            break\n        except Exception as exc:\n            if time.monotonic() >= deadline:\n                raise\n            print(f\"Elasticsearch not ready yet ({exc!r}); retrying\")\n            time.sleep(5)\n\n    indices = IndicesClient(client=ES_CLIENT)\n    indices.put_template(\n        name=TEMPLATE_NAME,\n        body={\"index_patterns\": [\"*\"], \"order\": -1, \"settings\": SETTINGS},\n    )\n    indices.put_settings(\n        body=SETTINGS,\n        index=\"_all\",\n        allow_no_indices=True,\n        ignore_unavailable=True,\n    )\n    print(\"Pinned number_of_replicas=0 for existing and future indices\")\n"
