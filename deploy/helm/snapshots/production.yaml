# Source: ifrcgo-helm/templates/playwright.yaml
# Headless-browser server used by the screenshot / PDF-export Celery tasks.
# Exposes a Playwright server over ws://<name>:<port>/; the app reaches it via
# PLAYWRIGHT_SERVER_URL (see app.extraEnvVars in values.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-playwright
  labels:
    app.kubernetes.io/name: go-api-playwright
    app.kubernetes.io/component: playwright
    app.kubernetes.io/part-of: release-name
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-api-playwright
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-api-playwright
    spec:
      containers:
        - name: playwright
          image: "mcr.microsoft.com/playwright:v1.50.0-noble"
          workingDir: /home/pwuser
          command:
            - bash
            - -xc
            - |
              PLAYWRIGHT_VERSION=$(grep -oP '"driverVersion": "\K[^"]+' /ms-playwright/.docker-info)
              npx -y playwright@$PLAYWRIGHT_VERSION run-server --host 0.0.0.0 --port 3000
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "0.1"
              memory: 1Gi
